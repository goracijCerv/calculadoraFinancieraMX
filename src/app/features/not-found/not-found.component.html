<section class="not-found" role="alert">
  <p class="not-found__code">404</p>
  <h1 class="not-found__title">Página no encontrada</h1>
  <p class="not-found__message">
    La página que buscas no existe o cambió de dirección. Revisa el enlace o
    vuelve al inicio para seguir con tus cálculos.
  </p>
  <a class="not-found__home" routerLink="/">
    <app-icon class="not-found__home-icon" name="arrow-left" [size]="20" />
    <span>Volver al inicio</span>
  </a>
</section>

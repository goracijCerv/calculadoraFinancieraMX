<aside class="other-tools" aria-labelledby="other-tools-heading">
  <p class="other-tools__eyebrow" id="other-tools-heading">Otras herramientas</p>
  <a
    class="other-tools__card"
    [href]="toolHref()"
    target="_blank"
    rel="noopener noreferrer"
  >
    <span class="other-tools__name">{{ toolName() }}</span>
    <span class="other-tools__description">{{ toolDescription() }}</span>
  </a>
</aside>

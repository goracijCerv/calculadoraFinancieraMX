<button
  type="button"
  class="app-theme-toggle"
  [class.app-theme-toggle--stacked]="showLabel()"
  [attr.aria-label]="label()"
  [attr.aria-pressed]="isDark()"
  (click)="toggle()"
>
  @if (isDark()) {
    <!-- Icono sol (tema claro disponible) — SVG propio, currentColor -->
    <svg
      class="app-theme-toggle__icon"
      viewBox="0 0 24 24"
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2"></path>
      <path d="M12 20v2"></path>
      <path d="m4.93 4.93 1.41 1.41"></path>
      <path d="m17.66 17.66 1.41 1.41"></path>
      <path d="M2 12h2"></path>
      <path d="M20 12h2"></path>
      <path d="m6.34 17.66-1.41 1.41"></path>
      <path d="m19.07 4.93-1.41 1.41"></path>
    </svg>
  } @else {
    <!-- Icono luna (tema oscuro disponible) — SVG propio, currentColor -->
    <svg
      class="app-theme-toggle__icon"
      viewBox="0 0 24 24"
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
    </svg>
  }
  @if (showLabel()) {
    <span class="app-theme-toggle__label">{{ isDark() ? 'Claro' : 'Oscuro' }}</span>
  }
</button>
